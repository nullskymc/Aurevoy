name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-regression:
    name: build and regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared, agent and desktop web assets
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Regression M3
        run: npm run regression:m3

      - name: Regression M4
        run: npm run regression:m4

      - name: Regression M5
        run: npm run regression:m5
