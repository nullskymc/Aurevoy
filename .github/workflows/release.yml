name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tauri updater 签名密钥（minisign）。缺失时构建会失败——必须在仓库 Secrets 中配置。
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Require updater signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY (Tauri updater minisign private key)."
            exit 1
          fi

      - name: Tauri Build (DMG + updater artifacts)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Require updater signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY (Tauri updater minisign private key)."
            exit 1
          fi

      - name: Tauri Build (NSIS + updater artifacts)
        run: cd apps/desktop && tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Require updater signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY (Tauri updater minisign private key)."
            exit 1
          fi

      - name: Tauri Build (Deb + AppImage + updater artifacts)
        run: cd apps/desktop && tauri build --bundles deb,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage + signatures
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --artifacts-dir artifacts \
            --version "${{ steps.meta.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --out latest.json \
            --notes "Aurevoy v${{ steps.meta.outputs.version }}"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Aurevoy v${{ steps.meta.outputs.version }}
          files: |
            artifacts/aurevoy-macos/**
            artifacts/aurevoy-windows/**
            artifacts/aurevoy-linux-deb/**
            artifacts/aurevoy-linux-appimage/**
            latest.json
          generate_release_notes: true
          # latest.json 只会被非 prerelease 的 latest 指向；正式版保持 false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
