name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare agent node_modules
        run: npm run prepare-agent-deps

      - name: Bundle Node.js runtime
        run: |
          mkdir -p apps/desktop/src-tauri/node-runtime/bin
          cp "$(which node)" apps/desktop/src-tauri/node-runtime/bin/node
          chmod +x apps/desktop/src-tauri/node-runtime/bin/node
          echo "Bundled Node.js $(node --version) to node-runtime/bin/node"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (DMG)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
