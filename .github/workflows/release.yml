name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare agent node_modules
        run: |
          cd apps/agent
          mkdir -p node_modules
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          // Collect all production transitive dependencies
          const pkg = require('./package.json');
          const allDeps = new Set(Object.keys(pkg.dependencies || {}));
          const resolved = new Set();

          function resolveTransitive(name, rootNm) {
            if (resolved.has(name)) return;
            resolved.add(name);
            // try npm path first, then workspace path
            const npmPath = path.join(rootNm, name, 'package.json');
            let pkgPath = fs.existsSync(npmPath) ? npmPath : null;
            if (!pkgPath) {
              const parts = name.split('/');
              if (parts.length > 1) {
                const wsPath = path.join(rootNm, '..', 'packages', parts[1], 'package.json');
                if (fs.existsSync(wsPath)) pkgPath = wsPath;
              }
            }
            if (pkgPath) {
              try {
                const depPkg = require(pkgPath);
                for (const d of Object.keys(depPkg.dependencies || {})) {
                  if (!allDeps.has(d)) { allDeps.add(d); resolveTransitive(d, rootNm); }
                }
              } catch (e) { console.error('  resolve error:', name, e.message); }
            }
          }

          const rootNm = '../../node_modules';
          for (const dep of [...allDeps]) resolveTransitive(dep, rootNm);
          console.log('Packages needed:', allDeps.size);

          let ok = 0, missing = 0;
          for (const name of allDeps) {
            const destDir = path.dirname(path.join('node_modules', name));
            fs.mkdirSync(destDir, { recursive: true });
            const dest = path.join('node_modules', name);
            const src = path.join(rootNm, name);

            let copySrc = null;
            if (fs.existsSync(src)) {
              copySrc = src;
            } else {
              // Fallback: workspace package under packages/
              const parts = name.split('/');
              if (parts.length > 1) {
                const wsSrc = path.join(rootNm, '..', 'packages', parts[1]);
                if (fs.existsSync(wsSrc)) copySrc = wsSrc;
              }
            }

            if (copySrc) {
              execSync('cp -RL ' + copySrc + ' ' + dest, { stdio: 'pipe' });
              ok++;
            } else {
              console.error('  MISSING:', name);
              missing++;
            }
          }
          console.log('Copied ' + ok + ' packages to agent/node_modules');
          if (missing > 0) { console.error('WARNING: ' + missing + ' packages missing'); }
          "

      - name: Bundle Node.js runtime
        run: |
          mkdir -p apps/desktop/src-tauri/node-runtime/bin
          cp "$(which node)" apps/desktop/src-tauri/node-runtime/bin/node
          chmod +x apps/desktop/src-tauri/node-runtime/bin/node
          echo "Bundled Node.js $(node --version) to node-runtime/bin/node"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (DMG)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
