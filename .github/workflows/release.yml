name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare agent node_modules
        run: |
          cd apps/agent
          mkdir -p node_modules
          node -e "
          const pkg = require('./package.json');
          const deps = Object.keys(pkg.dependencies || {});
          const { execSync, existsSync } = require('child_process');
          const fs = require('fs');
          let count = 0;
          for (const dep of deps) {
            const src = '../../node_modules/' + dep;
            const dest = 'node_modules/' + dep;
            if (fs.existsSync(src)) {
              execSync('cp -R ' + src + ' ' + dest);
              process.stdout.write('  copied: ' + dep + '\n');
              count++;
            } else {
              process.stdout.write('  MISSING: ' + dep + '\n');
            }
          }
          console.log('Copied ' + count + ' packages to agent/node_modules');
          "

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (DMG)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
