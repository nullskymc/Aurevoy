name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Prepare updater signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY:-}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY"
            echo "Value must be the exact one-line content of ~/.tauri/aurevoy.key (no quotes)."
            exit 1
          fi
          # 去掉首尾空白/换行；不要再 base64 编一层
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # 若误包了一层引号则剥掉
          if [[ "$KEY" == \"*\" && "$KEY" == *\" ]]; then
            KEY="${KEY:1:${#KEY}-2}"
          fi
          KEY_FILE="${RUNNER_TEMP}/tauri_signing.key"
          # 单行写入，无尾部换行，避免 base64 解码踩 Invalid symbol
          printf '%s' "$KEY" > "$KEY_FILE"
          # 校验：应为单行 base64（约 300+ 字符），不能是路径、不能是多行 minisign 明文
          if grep -q ':' "$KEY_FILE"; then
            echo "Secret looks like multi-line minisign text (contains ':')."
            echo "Use the one-line file from: cat ~/.tauri/aurevoy.key"
            exit 1
          fi
          LEN=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "Updater key file bytes: ${LEN}"
          if [ "$LEN" -lt 200 ]; then
            echo "Key too short (${LEN}). Did you paste the public key or a path?"
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=${KEY_FILE}"
            # 仅在真正设置了密码时导出；空密码密钥不要设假密码
            if [ -n "${RAW_PASSWORD:-}" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${RAW_PASSWORD}"
            fi
          } >> "$GITHUB_ENV"

      - name: Tauri Build (DMG + updater artifacts)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Prepare updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY:-}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$KEY" == \"*\" && "$KEY" == *\" ]]; then
            KEY="${KEY:1:${#KEY}-2}"
          fi
          KEY_FILE="${RUNNER_TEMP}/tauri_signing.key"
          printf '%s' "$KEY" > "$KEY_FILE"
          if grep -q ':' "$KEY_FILE"; then
            echo "Secret looks like multi-line minisign text. Use: cat ~/.tauri/aurevoy.key"
            exit 1
          fi
          LEN=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "Updater key file bytes: ${LEN}"
          if [ "$LEN" -lt 200 ]; then
            echo "Key too short (${LEN})."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=${KEY_FILE}"
            if [ -n "${RAW_PASSWORD:-}" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${RAW_PASSWORD}"
            fi
          } >> "$GITHUB_ENV"

      - name: Tauri Build (NSIS + updater artifacts)
        run: cd apps/desktop && tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare desktop bundle resources
        run: npm run prepare-desktop-bundle

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Prepare updater signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY:-}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$KEY" == \"*\" && "$KEY" == *\" ]]; then
            KEY="${KEY:1:${#KEY}-2}"
          fi
          KEY_FILE="${RUNNER_TEMP}/tauri_signing.key"
          printf '%s' "$KEY" > "$KEY_FILE"
          if grep -q ':' "$KEY_FILE"; then
            echo "Secret looks like multi-line minisign text. Use: cat ~/.tauri/aurevoy.key"
            exit 1
          fi
          LEN=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "Updater key file bytes: ${LEN}"
          if [ "$LEN" -lt 200 ]; then
            echo "Key too short (${LEN})."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=${KEY_FILE}"
            if [ -n "${RAW_PASSWORD:-}" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${RAW_PASSWORD}"
            fi
          } >> "$GITHUB_ENV"

      - name: Tauri Build (Deb + AppImage + updater artifacts)
        run: cd apps/desktop && tauri build --bundles deb,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage + signatures
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --artifacts-dir artifacts \
            --version "${{ steps.meta.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --out latest.json \
            --notes "Aurevoy v${{ steps.meta.outputs.version }}"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: Aurevoy v${{ steps.meta.outputs.version }}
          files: |
            artifacts/aurevoy-macos/**
            artifacts/aurevoy-windows/**
            artifacts/aurevoy-linux-deb/**
            artifacts/aurevoy-linux-appimage/**
            latest.json
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
