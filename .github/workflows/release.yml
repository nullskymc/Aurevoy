name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare agent node_modules (for Tauri bundle)
        run: npm run prepare-agent-deps

      - name: Bundle Node.js runtime
        run: |
          mkdir -p apps/desktop/src-tauri/node-runtime/bin
          cp "$(which node)" apps/desktop/src-tauri/node-runtime/bin/node
          chmod +x apps/desktop/src-tauri/node-runtime/bin/node
          echo "Bundled Node.js $(node --version) to node-runtime/bin/node"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (DMG)
        run: cd apps/desktop && tauri build --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare agent node_modules (for Tauri bundle)
        run: npm run prepare-agent-deps

      - name: Bundle Node.js runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/node-runtime/bin
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath apps/desktop/src-tauri/node-runtime/bin/node.exe
          Write-Output "Bundled Node.js $(& node --version) to node-runtime/bin/node.exe"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (NSIS)
        run: cd apps/desktop && tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (shared + agent + desktop)
        run: npm run build

      - name: Prepare agent node_modules (for Tauri bundle)
        run: npm run prepare-agent-deps

      - name: Bundle Node.js runtime
        run: |
          mkdir -p apps/desktop/src-tauri/node-runtime/bin
          cp "$(which node)" apps/desktop/src-tauri/node-runtime/bin/node
          chmod +x apps/desktop/src-tauri/node-runtime/bin/node
          echo "Bundled Node.js $(node --version) to node-runtime/bin/node"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Tauri Build (Deb + AppImage)
        run: cd apps/desktop && tauri build --bundles deb,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Sync web-ui to Android assets
        run: bash scripts/sync-android-assets.sh

      - name: Remove local.properties (CI uses ANDROID_HOME)
        run: rm -f apps/android/local.properties

      - name: Generate Gradle Wrapper
        working-directory: apps/android
        run: gradle wrapper --gradle-version 8.13

      - name: Build Android APK (debug)
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurevoy-android
          path: apps/android/app/build/outputs/apk/debug/*.apk

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/aurevoy-macos/*.dmg
            artifacts/aurevoy-windows/*.exe
            artifacts/aurevoy-linux-deb/*.deb
            artifacts/aurevoy-linux-appimage/*.AppImage
            artifacts/aurevoy-android/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
