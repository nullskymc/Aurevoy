services:
  agent:
    build: .
    container_name: aurevoy-agent
    ports:
      - "8787:8787"
    volumes:
      - aurevoy-data:/root/.aurevoy
    environment:
      AUREVOY_HOST: 0.0.0.0
      AUREVOY_PORT: 8787
      AUREVOY_PYTHON_AUTO_SETUP: "false"
      AUREVOY_PYTHON_HOME: /usr
      AUREVOY_LOG_PRETTY: "false"
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{process.exit(r.ok?0:1)})"]
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  aurevoy-data:
